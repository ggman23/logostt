name: Collecte des clubs et des logos

# La collecte a besoin d'un accès internet vers l'annuaire de la FFTT et vers les sites
# des clubs : elle tourne ici, sur les serveurs GitHub.
#
# Deux façons de la lancer :
#   · onglet Actions -> « Run workflow » (formulaire complet) ;
#   · en écrivant le périmètre voulu dans .github/lancer-collecte.txt puis en poussant
#     (« tous », « IDF », « 75 »…), ce qui déclenche une collecte complète.
on:
  workflow_dispatch:
    inputs:
      perimetre:
        description: "Périmètre : « tous », une ligue (IDF, BRE…) ou un département (75)"
        default: "tous"
      source:
        description: "Source de la liste des clubs"
        type: choice
        options: ["carte", "clicktt", "angleterre", "belgique", "autriche", "pologne", "croatie", "fftt", "opendata"]
        default: "carte"
      etapes:
        description: "Étapes à lancer"
        type: choice
        options: ["clubs+logos", "clubs", "logos"]
        default: "clubs+logos"
      forcer_logos:
        description: "Retélécharger les logos déjà connus"
        type: boolean
        default: false
  push:
    paths: [".github/lancer-collecte.txt"]
  schedule:
    - cron: "0 4 1 * *"   # tous les 1ers du mois à 4 h UTC

permissions:
  contents: write

concurrency:
  # Une nouvelle demande remplace la collecte en cours plutôt que d'attendre derrière
  # elle : deux collectes en parallèle se marcheraient dessus au moment de publier.
  group: collecte
  cancel-in-progress: true

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier le pipeline
        run: python3 tests/test_pipeline.py

      - name: Déterminer le périmètre
        id: parametres
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            perimetre="${{ github.event.inputs.perimetre }}"
            source="${{ github.event.inputs.source }}"
            etapes="${{ github.event.inputs.etapes }}"
            forcer="${{ github.event.inputs.forcer_logos }}"
            federation="DE"
          else
            # 1re ligne : le périmètre ; 2e : les étapes ; 3e : « forcer » pour revoir
            # les logos déjà connus (par défaut on ne traite que ceux qui manquent).
            perimetre="$(sed -n 1p .github/lancer-collecte.txt | tr -d ' \r\n')"
            etapes="$(sed -n 2p .github/lancer-collecte.txt | tr -d ' \r\n')"
            source="carte"
            federation="DE"
            # « DE » et « CH » basculent sur les annuaires click-TT correspondants,
            # « EN » sur les données ouvertes de Table Tennis England.
            case "$perimetre" in
              DE|de|allemagne|Allemagne) source="clicktt"; federation="DE"; perimetre="tous" ;;
              CH|ch|suisse|Suisse) source="clicktt"; federation="CH"; perimetre="tous" ;;
              EN|en|GB|gb|angleterre|Angleterre) source="angleterre"; federation="EN"; perimetre="tous" ;;
              BE|be|belgique|Belgique) source="belgique"; federation="BE"; perimetre="tous" ;;
              AT|at|autriche|Autriche) source="autriche"; federation="AT"; perimetre="tous" ;;
              PL|pl|pologne|Pologne) source="pologne"; federation="PL"; perimetre="tous" ;;
              HR|hr|croatie|Croatie) source="croatie"; federation="HR"; perimetre="tous" ;;
            esac
            case "$(sed -n 3p .github/lancer-collecte.txt | tr -d ' \r\n')" in
              forcer|force|oui|true) forcer="true" ;;
              # « recommencer » relit tout l'annuaire au lieu de compléter l'existant.
              recommencer|reprise|neuf) forcer="false"; recommencer="true" ;;
              *) forcer="false" ;;
            esac
          fi
          echo "perimetre=${perimetre:-tous}" >> "$GITHUB_OUTPUT"
          echo "source=${source:-carte}" >> "$GITHUB_OUTPUT"
          echo "etapes=${etapes:-clubs+logos}" >> "$GITHUB_OUTPUT"
          echo "forcer=${forcer:-false}" >> "$GITHUB_OUTPUT"
          echo "federation=${federation:-DE}" >> "$GITHUB_OUTPUT"
          echo "recommencer=${recommencer:-false}" >> "$GITHUB_OUTPUT"
          echo "Collecte « ${perimetre:-tous} » (source ${source:-carte}, étapes ${etapes:-clubs+logos})"

      - name: Collecter la liste des clubs
        if: ${{ steps.parametres.outputs.etapes != 'logos' }}
        env:
          FFTT_API_ID: ${{ secrets.FFTT_API_ID }}
          FFTT_API_KEY: ${{ secrets.FFTT_API_KEY }}
        run: |
          python3 scripts/collecte_clubs.py \
            --dep "${{ steps.parametres.outputs.perimetre }}" \
            --source "${{ steps.parametres.outputs.source }}" \
            ${{ steps.parametres.outputs.source == 'clicktt' && format('--federation {0}', steps.parametres.outputs.federation) || '' }} \
            ${{ steps.parametres.outputs.recommencer == 'true' && '--recommencer' || '' }} \
            --budget 120

      - name: Récupérer les logos
        if: ${{ steps.parametres.outputs.etapes != 'clubs' }}
        run: |
          python3 scripts/collecte_logos.py \
            --dep "${{ steps.parametres.outputs.perimetre }}" \
            ${{ steps.parametres.outputs.source != 'carte' && format('--pays {0}', steps.parametres.outputs.federation) || '' }} \
            --budget 100 \
            ${{ steps.parametres.outputs.forcer == 'true' && '--forcer' || '' }}

      - name: Générer les données du site
        run: python3 scripts/construire_site.py

      - name: Publier les résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Se replacer sur la pointe de main SANS toucher aux fichiers collectés :
          # une collecte dure des heures, main a pu avancer entre-temps, et un rebase
          # sur le catalogue provoquerait un conflit impossible à résoudre tout seul.
          # Les fichiers produits par la collecte font foi pour data/ et site/.
          for essai in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add data site/data site/logos
            if git diff --cached --quiet; then
              echo "Aucun changement."
              exit 0
            fi
            git commit -m "Collecte du $(date +%d/%m/%Y) (${{ steps.parametres.outputs.perimetre }})"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Poussée refusée (essai $essai), nouvelle tentative."
            sleep 10
          done
          exit 1
